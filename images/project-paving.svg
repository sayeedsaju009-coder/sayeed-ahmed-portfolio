<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Interlocking paver block pattern">
  <defs>
    <pattern id="p" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#8f8a83"/>
      <rect x="2" y="2" width="36" height="16" rx="2" fill="#b7aea2"/>
      <rect x="42" y="2" width="36" height="16" rx="2" fill="#a59c90"/>
      <rect x="-18" y="22" width="36" height="16" rx="2" fill="#a59c90"/>
      <rect x="22" y="22" width="36" height="16" rx="2" fill="#b7aea2"/>
      <rect x="62" y="22" width="36" height="16" rx="2" fill="#a59c90"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#p)"/>
  <rect x="360" y="0" width="280" height="360" fill="#14233a" opacity="0.92"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#f3f5f8">
    <text x="384" y="74" font-size="13" fill="#e8681a" font-weight="700" letter-spacing="2">METHOD STATEMENT</text>
    <g font-size="14">
      <text x="384" y="118">☑ BC · BM · DBM</text>
      <text x="384" y="150">☑ SPC</text>
      <text x="384" y="182">☑ Paver Block</text>
      <text x="384" y="214">☑ ITP · Hold points</text>
      <text x="384" y="246">☑ Equipment &amp; safety</text>
    </g>
  </g>
  <rect x="20" y="20" rx="6" width="160" height="30" fill="#14233a" opacity="0.85"/>
  <text x="34" y="40" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">QA / QC · ITPs</text>
</svg>
