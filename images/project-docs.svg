<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Correspondence register and document stack">
  <rect width="640" height="360" fill="#1e3352"/>
  <g transform="rotate(-6 220 190)">
    <rect x="130" y="80" width="200" height="240" rx="6" fill="#c9ced6"/>
  </g>
  <g transform="rotate(4 240 180)">
    <rect x="150" y="70" width="200" height="240" rx="6" fill="#f3f5f8"/>
    <g fill="#9fb0c6"><rect x="172" y="100" width="120" height="10" rx="3"/><rect x="172" y="124" width="156" height="6" rx="3"/><rect x="172" y="140" width="150" height="6" rx="3"/><rect x="172" y="156" width="156" height="6" rx="3"/><rect x="172" y="172" width="110" height="6" rx="3"/></g>
    <rect x="172" y="250" width="70" height="26" rx="4" fill="#e8681a"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="390" y="90" width="210" height="190" rx="8" fill="#14233a" stroke="#2a3a50"/>
    <text x="408" y="120" fill="#e8681a" font-size="12" font-weight="700" letter-spacing="2">EMAIL REGISTER</text>
    <g fill="#d8dee7" font-size="12">
      <text x="408" y="152">IN  · Submission</text>
      <text x="408" y="178">OUT · Reply sent</text>
      <text x="408" y="204">IN  · Approval</text>
      <text x="408" y="230">OUT · NCR reply</text>
      <text x="408" y="256">IN  · Instruction</text>
    </g>
  </g>
  <rect x="20" y="20" rx="6" width="170" height="30" fill="#e8681a"/>
  <text x="34" y="40" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">DOCUMENTATION</text>
</svg>
