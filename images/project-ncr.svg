<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="NCR status tracker">
  <rect width="640" height="360" fill="#eef1f5"/>
  <rect x="60" y="60" width="520" height="260" rx="10" fill="#fff" stroke="#dbe1e8"/>
  <rect x="60" y="60" width="520" height="44" rx="10" fill="#14233a"/>
  <rect x="60" y="94" width="520" height="10" fill="#14233a"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <text x="80" y="88" fill="#fff" font-weight="700">NCR No.</text><text x="210" y="88" fill="#fff" font-weight="700">Activity</text><text x="420" y="88" fill="#fff" font-weight="700">Status</text>
    <g fill="#16202e">
      <text x="80" y="140">NCR-01</text><text x="210" y="140">Drain levels</text>
      <text x="80" y="184">NCR-02</text><text x="210" y="184">DBM thickness</text>
      <text x="80" y="228">NCR-03</text><text x="210" y="228">Compaction test</text>
      <text x="80" y="272">NCR-04</text><text x="210" y="272">Paver edge</text>
    </g>
    <g stroke="#dbe1e8"><path d="M76 156h488M76 200h488M76 244h488"/></g>
    <rect x="416" y="124" width="76" height="24" rx="12" fill="#d8f0e2"/><text x="432" y="141" fill="#1e8a4c" font-weight="700">Closed</text>
    <rect x="416" y="168" width="76" height="24" rx="12" fill="#d8f0e2"/><text x="432" y="185" fill="#1e8a4c" font-weight="700">Closed</text>
    <rect x="416" y="212" width="76" height="24" rx="12" fill="#fdeee4"/><text x="428" y="229" fill="#c9530c" font-weight="700">Replied</text>
    <rect x="416" y="256" width="76" height="24" rx="12" fill="#fde2df"/><text x="436" y="273" fill="#c0392b" font-weight="700">Open</text>
  </g>
  <text x="80" y="300" fill="#5a6677" font-family="Segoe UI, Arial, sans-serif" font-size="11">Sample data for illustration</text>
</svg>
